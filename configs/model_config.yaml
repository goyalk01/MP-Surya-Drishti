# Model Configuration — MP Surya-Drishti Segmentation Framework
# ==============================================================

model:
  # Model type — must match a registered model in the registry.
  # Available types: segformer
  # Future: deeplabv3plus, mask2former, unet
  model_type: "segformer"

  # Model backbone from HuggingFace Hub (or torchvision, etc.)
  # SegFormer options: nvidia/mit-b0, nvidia/mit-b1, nvidia/mit-b2, nvidia/mit-b3, nvidia/mit-b4, nvidia/mit-b5
  # DeepLabV3+ options (future): resnet50, resnet101
  # Mask2Former options (future): facebook/mask2former-swin-base-ade-semantic
  backbone: "nvidia/mit-b2"

  # Number of output classes (background + foreground classes)
  num_labels: 2

  # Class label mappings
  id2label:
    0: "background"
    1: "rooftop"
  label2id:
    background: 0
    rooftop: 1

  # Input image size (height, width) — varies by model
  # SegFormer: 512 recommended
  # DeepLabV3+: 512 or 1024
  # Mask2Former: 512 or 1024
  image_size: 512

  # Confidence threshold for binary mask generation
  confidence_threshold: 0.5

  # Native-Resolution Tiling Strategy
  tiling:
    strategy: "tiled"           # "tiled" (native resolution crops) or "full_image" (resize)
    tile_size: 512              # Square patch size
    stride: 256                 # 50% overlap for boundary reconstruction

  # Sliding-Window Inference Settings
  tiled_inference:
    enabled: true               # Use sliding-window inference at original resolution
    tile_size: 512              # Window tile size
    stride: 256                 # 50% overlap
    batch_size: 8               # Parallel tiles per forward pass
    blend_mode: "gaussian"      # "gaussian" or "uniform"

  # Test-Time Augmentation (TTA)
  tta:
    enabled: false              # Isometric transforms (H-flip, V-flip, rot90)

  # Postprocessing Configuration
  postprocessing:
    cleaner:
      enabled: false            # Morphological cleaner (diagnostic only, raw prediction remains primary)
      min_region_area: 10       # Minimum connected component area in pixels
